[project]
name = "nagpur-krishi-data"
version = "0.1.0"
description = "Production-grade, mobile-first PWA and data platform for farmers of Nagpur district, Maharashtra, India"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8.0",
    "pandera>=0.20.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "tabulate>=0.9.0",
    "pypdf>=4.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["packages", "apps"]
